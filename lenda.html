<style>
  /* Tela de jogo: o canvas ocupa tudo; por cima, so o letreiro de carregar e o aviso de girar.
     Um visual so, escuro, como o jogo. */
  :root {
    color-scheme: dark;
    --night: #070a14;
    --panel: #0f1426;
    --ink: #e2dccb;
    --dim: #8f97b3;
    --gold: #e8c069;
    --winter: #7cc4ff;
    --summer: #ff8a4a;
    --autumn: #e0a040;
    --spring: #8ee08a;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Pixelify Sans", "Courier New", monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; background: var(--night); color: var(--ink); overflow: hidden; }
  body { font-family: var(--body); touch-action: none; -webkit-user-select: none; user-select: none; }

  #palco { position: fixed; inset: 0; background: var(--night); }
  #unity-canvas { width: 100%; height: 100%; display: block; background: var(--night); outline: none; }

  #letreiro {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: radial-gradient(ellipse at 50% 40%, #151b33 0%, var(--night) 70%);
  }
  .cartaz { width: min(560px, 100%); display: grid; gap: 18px; text-align: center; }
  h1 {
    font-family: var(--display); font-weight: 700; margin: 0;
    font-size: clamp(1.5rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: 0.04em;
    color: var(--gold); text-wrap: balance;
  }
  .estacoes { display: flex; justify-content: center; gap: 10px; }
  .estacoes span { width: 10px; height: 10px; transform: rotate(45deg); }
  .estacoes span:nth-child(1) { background: var(--spring); }
  .estacoes span:nth-child(2) { background: var(--summer); }
  .estacoes span:nth-child(3) { background: var(--autumn); }
  .estacoes span:nth-child(4) { background: var(--winter); }

  .barra { height: 12px; background: var(--panel); border: 2px solid #2a3150; position: relative; }
  .barra i {
    position: absolute; inset: 0; width: 0%;
    background: linear-gradient(90deg, var(--spring), var(--summer), var(--autumn), var(--winter));
    transition: width 0.25s linear;
  }
  #estado { color: var(--dim); font-size: 1rem; min-height: 1.3em; font-variant-numeric: tabular-nums; }
  #jogar {
    justify-self: center; font-family: var(--display); font-weight: 700; font-size: 1.2rem;
    letter-spacing: 0.08em; color: var(--night); background: var(--gold);
    border: 0; padding: 14px 36px; cursor: pointer;
  }
  #jogar:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .dica { color: var(--dim); font-size: 0.9rem; line-height: 1.45; max-width: 46ch; justify-self: center; }

  #girar {
    position: fixed; inset: 0; display: none; place-items: center; text-align: center;
    background: var(--night); color: var(--ink); padding: 24px; z-index: 5;
  }
  #girar strong { display: block; font-family: var(--display); color: var(--gold); font-size: 1.4rem; margin-bottom: 8px; }
  @media (orientation: portrait) and (pointer: coarse) { #girar { display: grid; } }

  @media (prefers-reduced-motion: reduce) { .barra i { transition: none; } }
</style>

<div id="palco"><canvas id="unity-canvas" tabindex="-1"></canvas></div>

<div id="letreiro">
  <div class="cartaz">
    <div class="estacoes" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1>A Lenda das Quatro Estações</h1>
    <div class="barra"><i id="progresso"></i></div>
    <div id="estado">Preparando a jornada…</div>
    <button id="jogar" type="button" hidden>Jogar</button>
    <p class="dica">Joystick à esquerda para andar. Atacar, Especial, Q, E, Esquiva, Usar e Aurelion à direita.
      A mira acha o inimigo mais perto sozinha. Toque no balão para passar a conversa.</p>
  </div>
</div>

<div id="girar" role="alert"><div><strong>Gire o celular</strong>A lenda se joga deitada.</div></div>

<script>
  const PEDACOS = {"code": [{"url": "jogo/codigo.0.wasm", "size": 13632485}], "data": [{"url": "jogo/dados.0.wasm", "size": 14680064}, {"url": "jogo/dados.1.wasm", "size": 12756445}]};
  const barra = document.getElementById('progresso');
  const estado = document.getElementById('estado');
  const jogar = document.getElementById('jogar');

  const mb = (n) => (n / 1048576).toFixed(1).replace('.', ',');

  async function baixar(lista, contar) {
    const partes = [];
    for (const parte of lista) {
      const resposta = await fetch(parte.url);
      if (!resposta.ok) throw new Error('Não deu para baixar ' + parte.url + ' (' + resposta.status + ')');
      if (resposta.body && resposta.body.getReader) {
        const leitor = resposta.body.getReader();
        for (;;) {
          const { done, value } = await leitor.read();
          if (done) break;
          partes.push(value);
          contar(value.length);
        }
      } else {
        const buffer = new Uint8Array(await resposta.arrayBuffer());
        partes.push(buffer);
        contar(buffer.length);
      }
    }
    return new Blob(partes);
  }

  async function descomprimir(blob, tipo) {
    if (typeof DecompressionStream !== 'undefined') {
      const fluxo = blob.stream().pipeThrough(new DecompressionStream('gzip'));
      return new Blob([await new Response(fluxo).arrayBuffer()], { type: tipo });
    }
    const bytes = new Uint8Array(await blob.arrayBuffer());
    return new Blob([pako.ungzip(bytes)], { type: tipo });
  }

  function carregarScript(src) {
    return new Promise((ok, falha) => {
      const tag = document.createElement('script');
      tag.src = src;
      tag.onload = ok;
      tag.onerror = () => falha(new Error('Não deu para carregar ' + src));
      document.body.appendChild(tag);
    });
  }

  async function iniciar() {
    if (!PEDACOS) { estado.textContent = 'Esta página ainda não foi empacotada.'; return; }
    const total = [...PEDACOS.code, ...PEDACOS.data].reduce((soma, p) => soma + p.size, 0);
    let baixado = 0;
    const contar = (n) => {
      baixado += n;
      barra.style.width = (70 * baixado / total).toFixed(1) + '%';
      estado.textContent = 'Baixando a lenda… ' + mb(baixado) + ' de ' + mb(total) + ' MB';
    };

    const codigoGz = await baixar(PEDACOS.code, contar);
    const dadosGz = await baixar(PEDACOS.data, contar);
    estado.textContent = 'Abrindo os reinos…';
    const codigo = await descomprimir(codigoGz, 'application/wasm');
    const dados = await descomprimir(dadosGz, 'application/octet-stream');
    barra.style.width = '75%';

    await carregarScript('jogo/loader.js');
    estado.textContent = 'Acendendo as tochas de Eldoria…';
    const canvas = document.getElementById('unity-canvas');
    const noCelular = !window.matchMedia('(pointer: coarse)').matches;
    const instancia = await createUnityInstance(canvas, {
      dataUrl: URL.createObjectURL(dados),
      frameworkUrl: 'jogo/framework.js',
      codeUrl: URL.createObjectURL(codigo),
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Four Seasons',
      productName: 'The Legend of the Four Seasons',
      productVersion: '1.0',
      // No celular, desenhar em 1 pixel por ponto: o aparelho esquenta menos e
      // o jogo segura 60 quadros. No PC, ate 2 para a arte ficar nitida.
      devicePixelRatio: noCelular ? Math.min(window.devicePixelRatio || 1, 2) : 1,
    }, (p) => { barra.style.width = (75 + 25 * p).toFixed(1) + '%'; });

    barra.style.width = '100%';
    estado.textContent = 'Pronto.';
    jogar.hidden = false;
    jogar.focus();
    jogar.addEventListener('click', () => {
      document.getElementById('letreiro').hidden = true;
      const tela = document.documentElement;
      try { (tela.requestFullscreen || tela.webkitRequestFullscreen || (() => {})).call(tela); } catch (e) { /* celular sem tela cheia */ }
      canvas.focus();
      window.lenda = instancia;
    }, { once: true });
  }

  // O app de tela de inicio: guarda o jogo no aparelho para abrir sem internet.
  // Em hospedagem que nao permite service worker (como o artifact do claude.ai)
  // isto simplesmente nao acontece, e o jogo roda normalmente pela rede.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => { /* sem offline, tudo bem */ });
    });
  }

  iniciar().catch((erro) => {
    estado.textContent = 'Não deu para abrir o jogo: ' + erro.message;
    console.error(erro);
  });
</script>
